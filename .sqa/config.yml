config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-reporting:
      branch: 2.0.0
      repo: https://github.com/EOSC-synergy/sqaaas-reporting
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-synergy/sqaaas-reporting git:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-orchid-lion.sh
        container: qc.acc_cloudy-scarlet-mau
  QC.Doc:
    repos:
      github.com/EOSC-synergy/sqaaas-reporting find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-persimmon-whale.sh
        container: qc.doc_slaphappy-copper-drever
      github.com/EOSC-synergy/sqaaas-reporting git:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-mustard-rattlesnake.sh
        container: qc.doc_stealthy-charcoal-binturong
      github.com/EOSC-synergy/sqaaas-reporting markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-chocolate-cat.sh
        container: qc.doc_cozy-ultramarine-bonobo
