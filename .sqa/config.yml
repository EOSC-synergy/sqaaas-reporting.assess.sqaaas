        - /usr/bin/env sh .sqa/script.queasy-rust-cichlid.sh
        container: qc.sec_boozy-pumpkin-frise
  QC.Sty:
    repos:
      github.com/EOSC-synergy/sqaaas-reporting flake8:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-goldenrod-greyhound.sh
        container: qc.sty_messy-violet-caterpillar
